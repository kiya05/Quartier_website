<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
     <link rel="shortcut icon" href="Assest/quartier-logo.png" type="image/x-icon">
</head>
<body>

       <a href="index.html">
      <div class="thank-you-modal" id="thankYouModal" aria-hidden="true">
       
      <div
        class="thank-you-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="thankTitle"
      >
      
        <button class="thank-close" type="button" aria-label="Close">×</button>
        <div class="thank-gesture" aria-hidden="true">👋</div>
        <div class="thank-sparkles">✦ ✧ ✦</div>
        <p class="eyebrow">MESSAGE RECEIVED</p>
        <h2 id="thankTitle">Thank you for <em>trusting us.</em></h2>
        <p>
          We’re grateful you chose Quartier. Our team will review your enquiry
          and get back to you soon.
        </p>

      
        <blockquote >
          “Beautiful spaces begin with thoughtful conversations.”
        </blockquote>
        <button class="dark-btn thank-ok" type="button">
          Wonderful, thank you ✦
        </button>
     
      </div>
       
    </div>
      </a>
    <script src="script.js"></script>
</body>
</html>
